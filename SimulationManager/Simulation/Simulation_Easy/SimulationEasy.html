<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel = "stylesheet" href="SimulationEasy.css">
    </head>
    <body>
        <h1>
            Simulation Easy
        </h1>

        <p>Money: <span id="MoneyDisplay"></span></p>

        <p>Simulation Runtime: <span id="Simulation_RUNTIME"></span> Minutes</p>

        <p>Power Production: <span id="PowerProductionDisplay"></span></p>
        <p>Power Consumption: <span id="PowerConsumptionDisplay"></span></p>
        <p>Power Balance: <span id="PowerDisplay"></span></p>
        <p>Stored Energy: <span id="StoredPowerDisplay"></span></p>
        <p>Crew Capacity: <span id="CrewDisplay"></span></p>
        <p>Storage Capacity: <span id="StorageDisplay"></span> kg</p>
        <p>Research: <span id="ResearchDisplay"></span></p>
        <p>Mission State: <span id="MissionStateDisplay"></span></p>
        <p>Mission Objective: <span id="MissionObjectiveDisplay"></span></p>
        <p>Mission Score: <span id="ScoreDisplay">0</span></p>
        <p>Mission Rating: <span id="RatingDisplay">Not Rated</span></p>
        <p>Warning: <span id="WarningDisplay">None</span></p>

        <button id="StartMissionButton" class="button">Start Mission</button>

        <div id="Module_Array"></div>
        <script src="SimulationEasy.js"></script>
    </body>
</html>
