<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="Summary.css">
    </head>
    <body>
        <main class="summary-panel">
            <h1>Mission Summary</h1>

            <div class="summary-grid">
                <div class="summary-card">
                    <span class="label">Outcome</span>
                    <span id="OutcomeText">-</span>
                </div>
                <div class="summary-card">
                    <span class="label">Score</span>
                    <span id="ScoreText">0</span>
                </div>
                <div class="summary-card">
                    <span class="label">Rating</span>
                    <span id="RatingText">Not Rated</span>
                </div>
                <div class="summary-card">
                    <span class="label">Research</span>
                    <span id="ResearchText">0</span>
                </div>
                <div class="summary-card">
                    <span class="label">Mission Time</span>
                    <span id="TimeText">0</span>
                </div>
                <div class="summary-card">
                    <span class="label">Money Left</span>
                    <span id="MoneyText">$0</span>
                </div>
                <div class="summary-card">
                    <span class="label">Power Balance</span>
                    <span id="PowerText">0</span>
                </div>
                <div class="summary-card">
                    <span class="label">Difficulty</span>
                    <span id="DifficultyText">Easy</span>
                </div>
            </div>

            <div class="button-row">
                <button id="PlayAgainButton">Play Again</button>
                <button id="DifficultyButton" class="secondary">Difficulty Select</button>
            </div>
        </main>

        <script src="Summary.js"></script>
    </body>
</html>
